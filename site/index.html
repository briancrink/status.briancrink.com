<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <link rel="icon" href="../resources/images/icons/favicon.png" type="image/png" media="(prefers-color-scheme: light)">
  <link rel="icon" href="../resources/images/icons/favicon-white.png" type="image/png" media="(prefers-color-scheme: dark)">
  <link rel="apple-touch-icon" href="../resources/images/icons/apple-touch-icon.png">
  <link rel="apple-touch-icon" href="../resources/images/icons/apple-touch-icon-dark.png" media="(prefers-color-scheme: dark)">
  <link rel="canonical" href="https://site.briancrink.com/map">
  <title>Site Map | Brian Crink</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --hero-compact: 0;
      --compact-range: 160px;
      --image-y: 20px;
      --image-slot: 156px;
      --compact-gap: 18px;
      --tool-collapse: 138px;
      --scroll-cancel: 0px;
      --chrome-expanded: 420px;
      --page-bg: #000000;
      --page-fg: #ffffff;
    }

    html, body {
      height: 100%;
      max-height: 100%;
      overflow: hidden;
      background-color: var(--page-bg);
      color: var(--page-fg);
    }

    html, body {
      background-color: var(--page-bg);
      transition: background-color 0.45s ease, color 0.45s ease;
    }

    .container, .page-flow {
      background-color: transparent;
      transition: color 0.45s ease;
    }

    #topoCanvas {
      position: fixed;
      inset: 0;
      width: 100%;
      height: 100%;
      z-index: 0;
      pointer-events: none;
    }

    .container {
      position: relative;
      z-index: 1;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      line-height: 1.6;
      opacity: 0;
      animation: fadeIn 1.3s forwards;
      padding: 0;
    }

    body.light,
    html:has(body.light) {
      --page-bg: #ffffff;
      --page-fg: #1a1a1a;
    }

    @keyframes fadeIn {
      from { opacity: 0; }
      to   { opacity: 1; }
    }

    .legend.view-entering {
      animation: fadeIn 1.1s forwards;
    }

    .links.view-entering > div {
      opacity: 0;
      animation: fadeIn 1.1s forwards;
      animation-delay: calc(var(--col, 0) * 0.14s);
    }

    .container {
      position: relative;
      max-width: 1400px;
      width: 100%;
      margin: 0 auto;
      text-align: center;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 0 16px 48px;
    }

    .header {
      position: fixed;
      top: 0;
      left: 0;
      right: 0;
      z-index: 30;
      width: 100%;
      padding: 10px 56px 12px;
      background-color: transparent;
    }

    .page-flow {
      width: 100%;
      padding-top: 12px;
      padding-bottom: 48px;
    }

    #scroller {
      position: fixed;
      left: 0;
      right: 0;
      top: var(--chrome-expanded);
      bottom: 0;
      z-index: 1;
      overflow-x: hidden;
      overflow-y: auto;
      overscroll-behavior-y: none;
      -webkit-overflow-scrolling: touch;
      padding: 0 56px;
    }

    .divider {
      width: 70%;
      height: 1px;
      border: none;
      background-color: rgba(255, 255, 255, 0.2);
      margin: 1rem auto 0;
    }

    body.light .divider {
      background-color: rgba(0, 0, 0, 0.15);
    }

    @property --pc1 { syntax: '<color>'; inherits: false; initial-value: #ff006e; }
    @property --pc2 { syntax: '<color>'; inherits: false; initial-value: #8338ec; }
    @property --pc3 { syntax: '<color>'; inherits: false; initial-value: #3a86ff; }
    @property --pc4 { syntax: '<color>'; inherits: false; initial-value: #06d6a0; }
    @property --pc5 { syntax: '<color>'; inherits: false; initial-value: #ffbe0b; }

    @keyframes portalChromaFade {
      0%   { --pc1: #ff006e; --pc2: #8338ec; --pc3: #3a86ff; --pc4: #06d6a0; --pc5: #ffbe0b; }
      20%  { --pc1: #ffbe0b; --pc2: #ff006e; --pc3: #8338ec; --pc4: #3a86ff; --pc5: #06d6a0; }
      40%  { --pc1: #06d6a0; --pc2: #ffbe0b; --pc3: #ff006e; --pc4: #8338ec; --pc5: #3a86ff; }
      60%  { --pc1: #3a86ff; --pc2: #06d6a0; --pc3: #ffbe0b; --pc4: #ff006e; --pc5: #8338ec; }
      80%  { --pc1: #8338ec; --pc2: #3a86ff; --pc3: #06d6a0; --pc4: #ffbe0b; --pc5: #ff006e; }
      100% { --pc1: #ff006e; --pc2: #8338ec; --pc3: #3a86ff; --pc4: #06d6a0; --pc5: #ffbe0b; }
    }

    .site-nav-link.portal {
      background-image: linear-gradient(90deg, var(--pc1), var(--pc2), var(--pc3), var(--pc4), var(--pc5));
      -webkit-background-clip: text;
      background-clip: text;
      color: transparent;
      -webkit-text-fill-color: transparent;
      animation: portalChromaFade 8s linear infinite;
    }

    @property --border-angle {
      syntax: '<angle>';
      inherits: false;
      initial-value: 0deg;
    }

    @keyframes versionPillBorderSpin {
      to { --border-angle: 360deg; }
    }

    .version-pill {
      position: relative;
      border: 1px solid transparent;
    }

    .version-pill::before {
      content: '';
      position: absolute;
      inset: 0;
      border-radius: inherit;
      padding: 1px;
      background: conic-gradient(from var(--border-angle), var(--pc1), var(--pc2), var(--pc3), var(--pc4), var(--pc5), var(--pc1));
      mask: linear-gradient(#fff 0 0) content-box, linear-gradient(#fff 0 0);
      mask-composite: exclude;
      animation: versionPillBorderSpin 8s linear infinite;
      pointer-events: none;
    }

    .version-pill::after {
      content: '';
      position: absolute;
      inset: 0;
      border-radius: inherit;
      background: linear-gradient(115deg, transparent 45%, rgba(255, 255, 255, 0.55) 50%, transparent 55%);
      background-repeat: no-repeat;
      background-size: 200% 100%;
      background-position: -50% 0;
      opacity: 0;
      transition: opacity 0.35s ease;
      animation: versionPillShine 2.6s linear infinite;
      animation-play-state: paused;
      pointer-events: none;
    }

    body.light .version-pill::after {
      background-image: linear-gradient(115deg, transparent 45%, rgba(0, 0, 0, 0.18) 50%, transparent 55%);
    }

    .version-pill:hover::after {
      opacity: 1;
      animation-play-state: running;
    }

    @keyframes versionPillShine {
      0%   { background-position: -50% 0; }
      100% { background-position: 150% 0; }
    }

    @media (prefers-reduced-motion: reduce) {
      .site-nav-link.portal { animation: none; }
      .version-pill::before { animation: none; }
      .version-pill::after { animation: none; }
    }

    .site-nav {
      margin: 0;
      color: #ffffff;
      font-size: 1rem;
      font-weight: 600;
      display: flex;
      align-items: center;
      justify-content: center;
      white-space: nowrap;
      letter-spacing: 0.16rem;
    }

    body.light .site-nav { color: #1a1a1a; }

    .site-link {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 0.55rem;
      margin: 0;
    }

    .site-nav .portal {
      text-transform: uppercase;
      font-size: 0.95rem;
      letter-spacing: 0.08rem;
    }

    .site-nav .nav-dot {
      color: #ffffff;
      font-weight: 400;
      font-size: 1.0rem;
      line-height: 1;
      letter-spacing: 0;
    }

    body.light .nav-dot { color: #000000; }

    .site-nav-link {
      color: inherit;
      text-decoration: none;
      cursor: pointer;
      transition: opacity 0.2s ease;
    }

    .site-nav-link:hover { opacity: 0.85; }

    .map-link {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      color: inherit;
      text-decoration: none;
      line-height: 0;
    }

    .map-link:hover { opacity: 0.85; }

    .map-icon {
      width: 3.4rem;
      height: 3.4rem;
      display: block;
    }

    .identity {
      position: relative;
      left: 0;
      right: 0;
      text-align: center;
      z-index: 1;
      margin-top: -2px;
    }

    .identity-inline {
      position: relative;
      display: inline-block;
    }

    .name {
      font-size: 3.0rem;
      font-weight: 600;
      color: #ffffff;
      margin: 0;
      letter-spacing: -0.5px;
      line-height: 1.05;
    }

    body.light .name { color: #1a1a1a; }

    .name-link {
      color: inherit;
      text-decoration: none;
      cursor: pointer;
      transition: opacity 0.2s ease;
    }

    .name-link:hover { opacity: 0.85; }

    .dev-image-mini {
      position: absolute;
      left: 100%;
      top: 50%;
      width: 60px;
      height: 60px;
      margin: 0 0 0 10px;
      object-fit: contain;
      pointer-events: none;
      transform: translateY(-50%);
      opacity: calc(max(0, (var(--hero-compact) - 0.9) / 0.10));
      z-index: 2;
    }

    @media (max-width: 700px) {
      .dev-image-mini { display: none; }
    }

    .hero {
      position: relative;
      width: 100%;
      display: flex;
      flex-direction: column;
      align-items: center;
      margin-top: 0;
    }

    .dev-image {
      position: absolute;
      left: 50%;
      top: var(--image-y);
      width: 160px;
      max-width: 160px;
      height: auto;
      margin: 0 0 0 -80px;
      z-index: 1;
      pointer-events: none;
      opacity: calc(1 - min(1, var(--hero-compact) / 0.35));
    }

    .view-toggle-wrap {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 28px;
      margin-top: 0;
      position: relative;
      z-index: 4;
      width: 100%;
      padding-top: calc(var(--image-slot) - (var(--hero-compact) * var(--tool-collapse)));
    }

    .mode-toggle {
      position: relative;
      display: inline-flex;
      width: max-content;
      max-width: calc(100% - 24px);
      background: rgba(255, 255, 255, 0.023);
      border: 1px solid rgba(255, 255, 255, 0.15);
      border-radius: 50px;
      padding: 4px;
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
      box-shadow: 0 4px 20px rgba(0, 0, 0, 0.4);
      margin-bottom: 0;
      z-index: 4;
      transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
    }

    .mode-toggle:hover {
      background: rgba(255, 255, 255, 0.06);
      border-color: rgba(255, 255, 255, 0.25);
      box-shadow: 0 8px 32px rgba(0, 0, 0, 0.5);
    }

    body.light .mode-toggle {
      background: rgba(0, 0, 0, 0.03);
      border-color: rgba(0, 0, 0, 0.15);
      box-shadow: 0 4px 20px rgba(0, 0, 0, 0.08);
    }

    .toggle-slider {
      position: absolute;
      top: 4px;
      bottom: 4px;
      left: var(--slider-l, 4px);
      width: var(--slider-w, 50%);
      background: rgba(255, 255, 255, 0.18);
      border-radius: 46px;
      transition: left 0.3s cubic-bezier(0.4, 0, 0.2, 1), width 0.3s cubic-bezier(0.4, 0, 0.2, 1), background 0.3s cubic-bezier(0.4, 0, 0.2, 1);
      z-index: 1;
    }

    .mode-toggle.development .toggle-slider {
      background: rgba(62, 194, 255, 0.701);
    }

    .mode-toggle.availability .toggle-slider {
      background: #00ff5e9e;
    }

    body.light .toggle-slider,
    body.light .mode-toggle.map .toggle-slider {
      background: rgba(0, 0, 0, 0.38);
    }

    body.light .mode-toggle.development .toggle-slider {
      background: rgba(42, 187, 255, 0.712);
    }

    body.light .mode-toggle.availability .toggle-slider {
      background: #00eb56c3;
    }

    .toggle-option {
      position: relative;
      flex: 0 0 auto;
      padding: 8px 16px;
      min-width: 50px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      text-align: center;
      font-size: 15px;
      font-weight: 500;
      border-radius: 46px;
      z-index: 2;
      transition: color 0.2s ease;
      background: transparent;
      border: 0;
      color: rgba(255, 255, 255, 0.55);
      cursor: pointer;
      font-family: inherit;
      white-space: nowrap;
    }

    .toggle-option svg {
      width: 22px;
      height: 22px;
      display: block;
      fill: none;
      stroke: currentColor;
    }

    .toggle-option.active {
      color: rgba(255, 255, 255, 0.72);
    }

    .mode-toggle.development .toggle-option.active,
    .mode-toggle.availability .toggle-option.active {
      color: rgba(255, 255, 255, 0.72);
    }

    .toggle-option.inactive {
      color: rgba(255, 255, 255, 0.55);
    }

    body.light .toggle-option.inactive {
      color: #6b7280;
    }

    body.light .toggle-option.active,
    body.light .mode-toggle.map .toggle-option.active,
    body.light .mode-toggle.development .toggle-option.active,
    body.light .mode-toggle.availability .toggle-option.active {
      color: rgba(255, 255, 255, 0.72);
    }

    .toggle-label {
      position: absolute;
      width: 1px;
      height: 1px;
      padding: 0;
      margin: -1px;
      overflow: hidden;
      clip: rect(0, 0, 0, 0);
      white-space: nowrap;
      border: 0;
    }

    .legend {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 8px;
      width: min(420px, calc(100% - 24px));
      font-size: 0.72rem;
      letter-spacing: 0.02em;
      color: rgba(255, 255, 255, 0.42);
    }

    .legend-row {
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      gap: 8px 10px;
      width: 100%;
    }

    .legend .dev-pill,
    .legend .availability-pill,
    .legend .version-pill,
    .legend .system-tag {
      appearance: none;
      -webkit-appearance: none;
      cursor: pointer;
      transition: opacity 0.2s ease, background 0.2s ease, color 0.2s ease, border-color 0.2s ease;
    }

    .legend .dev-pill:hover,
    .legend .availability-pill:hover,
    .legend .version-pill:hover,
    .legend .system-tag:hover {
      opacity: 0.85;
    }

    body.light .legend { color: rgba(26, 26, 26, 0.45); }

    body[data-view="development"] .legend-status,
    body[data-view="availability"] .legend-dev,
    body[data-view="map"] .legend {
      display: none;
    }

    .links {
      width: 100%;
      column-width: 440px;
      column-gap: 1.25rem;
      text-align: left;
    }

    .links > div {
      display: flex;
      flex-direction: column;
      align-items: flex-start;
      text-align: left;
      gap: 0.42rem;
      break-inside: avoid;
      -webkit-column-break-inside: avoid;
      margin-bottom: 2.5rem;
      padding-left: 1.31rem;
    }

    @media (max-width: 600px) {
      .header { padding-left: 16px; padding-right: 16px; }
      #scroller { padding-left: 16px; padding-right: 16px; }
      .links {
        max-width: 320px;
        margin: 0 auto;
        column-width: auto;
      }
    }

    .sub-domain-link {
      display: inline-flex;
      align-items: center;
      gap: 0.5rem;
      margin-left: -1.31rem;
      font-size: 1.2rem;
      font-weight: 500;
      color: #ffffff;
      text-decoration: none;
      cursor: pointer;
      transition: opacity 0.2s ease;
    }

    body.light .sub-domain-link { color: #000000; }

    .domain-icon {
      width: 1.3em;
      height: 1.3em;
      flex-shrink: 0;
    }

    .sub-domain-link:hover { opacity: 0.85; }

    .page-row,
    .domain-row {
      display: flex;
      flex-direction: row;
      flex-wrap: wrap;
      align-items: center;
      gap: 0.28rem 0.45rem;
      width: 100%;
    }

    .page-row { margin-left: 0.75rem; }

    .row-meta {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      gap: 0.28rem 0.35rem;
    }

    .sub-page-link {
      font-size: 1.1rem;
      font-weight: 320;
      color: rgb(79, 140, 238);
      text-decoration: none;
      cursor: pointer;
      transition: opacity 0.2s ease;
    }

    body.light .sub-page-link { color: rgba(43, 101, 197, 1); }

    .sub-page-link:hover { opacity: 0.85; }

    .availability-pill {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      padding: 2px 8px 2px 7px;
      border-radius: 9999px;
      font-size: 0.64rem;
      font-weight: 600;
      letter-spacing: 0.02em;
      line-height: 1.3;
      white-space: nowrap;
      font-family: ui-monospace, "SF Mono", Menlo, Monaco, "Courier New", monospace;
    }

    .availability-dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      flex-shrink: 0;
      background: #6b7280;
    }

    .dev-pill,
    .version-pill,
    .system-tag {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      padding: 2px 8px;
      border-radius: 9999px;
      font-size: 0.64rem;
      font-weight: 600;
      letter-spacing: 0.02em;
      line-height: 1.3;
      white-space: nowrap;
      font-family: ui-monospace, "SF Mono", Menlo, Monaco, "Courier New", monospace;
    }

    .availability-dot[data-availability="unlisted"] { background: #9d9d9d; }
    .availability-dot[data-availability="preview"] { background: #c522c0; }
    .availability-dot[data-availability="live"] { background: #22c55e; }
    .availability-dot[data-availability="maintenance"] { background: #f59e0b; }
    .availability-dot[data-availability="down"] { background: #ef4444; }

    .version-pill {
      background: #32343871;
      color: #ffffff;
    }

    .legend .version-pill.is-active {
      background: #a4a4a44b;
      color: #ffffff;
    }

    .system-tag {
      background: #32343871;
      color: #9ca3af;
      border: 1px solid rgba(156, 163, 175, 0.45);
    }

    .legend .system-tag.is-active {
      background: #a4a4a47a;
      color: #cfcfcf;
      border-color: #a3a3a3ab; /*change to chroma border*/
    }

    .dev-pill[data-dev="planned"] {
      background: rgba(196, 181, 253, 0.18);
      color: #ddd6fe;
      border: 1px solid rgba(196, 181, 253, 0.32);
    }

    .legend .dev-pill.is-active[data-dev="planned"] {
      background: #a490ff88;
      color: #e1ceffe1;
    }

    .dev-pill[data-dev="in-development"] {
      background: rgba(125, 211, 252, 0.16);
      color: #7dd3fc;
      border: 1px solid rgba(125, 211, 252, 0.32);
    }

    .legend .dev-pill.is-active[data-dev="in-development"] {
      background: #57aeff57;
      color: #7dd3fc;
    }

    .dev-pill[data-dev="released"] {
      background: rgba(34, 197, 94, 0.16);
      color: #4ade80;
      border: 1px solid rgba(34, 197, 94, 0.28);
    }

    .legend .dev-pill.is-active[data-dev="released"] {
      background: #28ff7762;
      color: #b6ffd3ea;
    }

    .availability-pill[data-availability="unlisted"] {
      background: rgba(107, 114, 128, 0.18);
      color: #d1d5db;
      border: 1px solid rgba(107, 114, 128, 0.28);
    }

    .legend .availability-pill.is-active[data-availability="unlisted"] {
      background: #bababa7f;
      color: #e7e7e7ee;
    }

    .availability-pill[data-availability="preview"] {
      background: rgba(136, 59, 105, 0.18);
      color: #f361e7;
      border: 1px solid rgba(216, 46, 210, 0.28);
    }

    .legend .availability-pill.is-active[data-availability="preview"] {
      background: #ff68f56a;
      color: #ffb7fee3;
    }

    .availability-pill[data-availability="live"] {
      background: rgba(39, 201, 63, 0.16);
      color: #4ade80;
      border: 1px solid rgba(39, 201, 63, 0.32);
    }

    .legend .availability-pill.is-active[data-availability="live"] {
      background: #61ff9b71;
      color: #c0ffd9e6;
    }

    .availability-pill[data-availability="maintenance"] {
      background: rgba(245, 158, 11, 0.16);
      color: #fbbf24;
      border: 1px solid rgba(245, 158, 11, 0.28);
    }

    .legend .availability-pill.is-active[data-availability="maintenance"] {
      background: #ffcf557f;
      color: #ffce78ed;
    }

    .availability-pill[data-availability="down"] {
      background: rgba(239, 68, 68, 0.16);
      color: #f87171;
      border: 1px solid rgba(239, 68, 68, 0.28);
    }

    .legend .availability-pill.is-active[data-availability="down"] {
      background: #ff60608f;
      color: #ffa7a7;
    }

    body.light .version-pill {
      background: #f1f1f132;
      color: #77787a;
    }

    body.light .legend .version-pill.is-active {
      background: #a2a2a257;
      color: #77787a;
    }

    body.light .system-tag {
      background: #f1f1f132;
      color: #77787a;
      border-color: rgba(87, 87, 87, 0.28);
    }

    body.light .legend .system-tag.is-active {
      background: #a4a4a453;
      color: #77787a;
      border-color: #a3a3a3ab; /*change to chroma border*/
    }

    body.light .dev-pill[data-dev="planned"] {
      background: rgba(167, 139, 250, 0.16);
      color: #7c3aed;
      border-color: rgba(167, 139, 250, 0.28);
    }

    body.light .legend .dev-pill.is-active[data-dev="planned"] {
      background: #a490ff88;
      color: #7c3aed;
    }

    body.light .dev-pill[data-dev="in-development"] {
      background: rgba(14, 165, 233, 0.12);
      color: #0284c7;
      border-color: rgba(14, 165, 233, 0.24);
    }

  <script>
    const toggleBtn = document.getElementById('theme-toggle');
    const body = document.body;
    const sunIcon = `<svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.25" stroke-linecap="round" aria-hidden="true"><circle cx="12" cy="12" r="4.15"/><line x1="12" y1="2.4" x2="12" y2="5.1"/><line x1="12" y1="18.9" x2="12" y2="21.6"/><line x1="2.4" y1="12" x2="5.1" y2="12"/><line x1="18.9" y1="12" x2="21.6" y2="12"/><line x1="5.2" y1="5.2" x2="7.1" y2="7.1"/><line x1="16.9" y1="16.9" x2="18.8" y2="18.8"/><line x1="18.8" y1="5.2" x2="16.9" y2="7.1"/><line x1="7.1" y1="16.9" x2="5.2" y2="18.8"/></svg>`;
    const moonIcon = `<svg width="28" height="28" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M21 14.35A9 9 0 1 1 9.65 3 7.15 7.15 0 0 0 21 14.35z"/></svg>`;

    function setToggleIcon() {
      toggleBtn.innerHTML = body.classList.contains('light') ? moonIcon : sunIcon;
    }

    toggleBtn.addEventListener('click', () => {
      body.classList.toggle('light');
      setToggleIcon();
      if (typeof startTopoTheme === 'function') {
        startTopoTheme(body.classList.contains('light') ? 1 : 0);
      }
    });
    toggleBtn.addEventListener('mouseenter', setToggleIcon);
    toggleBtn.addEventListener('mouseleave', setToggleIcon);

    const TOPO_THEME_MS = 450;
    const GRID_ALPHA = 0.6;
    const RIPPLE_OPACITY = 0.14;
    let topoTheme = body.classList.contains('light') ? 1 : 0;
    let topoThemeFrom = topoTheme;
    let topoThemeTo = topoTheme;
    let topoThemeStart = 0;
    let topoAnim = 0;

    function topoStroke(t, illuminate, peak) {
      const lift = 0;
      const bloom = illuminate === true ? 1 : (typeof illuminate === 'number' ? illuminate : 0);
      const hi = peak == null ? 54 : peak;
      const g0 = 40 + bloom * (hi - 40) + lift * 140; //40 default / 50 desktop ridge / 72 mobile nest
      const a0 = Math.min(0.9, 0.85 + lift);
      const g1 = 30 + lift * 40;
      const a1 = Math.min(0.18, (0.10 + bloom * 0.06) + lift * 0.08);
      const u = t < 0 ? 0 : t > 1 ? 1 : t;
      const g = Math.round(g0 + (g1 - g0) * u);
      const a = a0 + (a1 - a0) * u;
      return 'rgba(' + g + ',' + g + ',' + g + ',' + a.toFixed(3) + ')';
    }

    const topoCanvas = document.getElementById('topoCanvas');
    const topoCtx = topoCanvas && topoCanvas.getContext('2d');
    let topoW = 0;
    let topoH = 0;
    let topoPath = null;
    let topoLoops = [];
    let topoNests = [];

    function hash2(ix, iy) {
      let n = (ix * 374761393 + iy * 668265263) | 0;
      n = (n ^ (n >>> 13)) * 1274126177;
      return ((n ^ (n >>> 16)) >>> 0) / 4294967296;
    }

    function noise2(x, y) {
      const x0 = Math.floor(x);
      const y0 = Math.floor(y);
      const fx = x - x0;
      const fy = y - y0;
      const sx = fx * fx * (3 - 2 * fx);
      const sy = fy * fy * (3 - 2 * fy);
      const v00 = hash2(x0, y0);
      const v10 = hash2(x0 + 1, y0);
      const v01 = hash2(x0, y0 + 1);
      const v11 = hash2(x0 + 1, y0 + 1);
      return v00 * (1 - sx) * (1 - sy) + v10 * sx * (1 - sy) + v01 * (1 - sx) * sy + v11 * sx * sy;
    }

    function ridgeN(x, y) {
      const n = noise2(x, y);
      return 1 - Math.abs(n * 2 - 1);
    }

    function heightAt(x, y) {
      const wx = noise2(x * 0.0019 + 21, y * 0.0019 + 7) * 32;
      const wy = noise2(x * 0.0019 + 3, y * 0.0019 + 41) * 32;
      const nx = (x + wx) * 0.0088;
      const ny = (y + wy) * 0.0088;
      return ridgeN(nx, ny) * 0.48
        + ridgeN(nx * 1.85 + 8, ny * 1.85) * 0.28
        + ridgeN(nx * 3.1 + 19, ny * 3.1) * 0.12
        + noise2(nx * 5.4 + 33, ny * 5.4) * 0.05;
    }

    function buildTopoPath() {
      if (!topoCtx) return;
      const cell = 12;
      const cols = Math.ceil(topoW / cell);
      const rows = Math.ceil(topoH / cell);
      const field = new Float32Array((cols + 1) * (rows + 1));
      const stride = cols + 1;
      for (let r = 0; r <= rows; r++) {
        for (let c = 0; c <= cols; c++) {
          field[r * stride + c] = heightAt(c * cell, r * cell);
        }
      }
      const levels = [];
      for (let v = 0.18; v <= 0.84; v += 0.048) levels.push(v);
      const path = new Path2D();
      const rawByLevel = new Map();
      function interp(a, b, level) {
        const d = b - a;
        if (Math.abs(d) < 1e-6) return 0.5;
        return (level - a) / d;
      }
      function pushSeg(x0, y0, x1, y1, level) {
        path.moveTo(x0, y0);
        path.lineTo(x1, y1);
        if (!rawByLevel.has(level)) rawByLevel.set(level, []);
        rawByLevel.get(level).push(x0, y0, x1, y1);
      }
      for (let li = 0; li < levels.length; li++) {
        const level = levels[li];
        for (let r = 0; r < rows; r++) {
          for (let c = 0; c < cols; c++) {
            const v0 = field[r * stride + c];
            const v1 = field[r * stride + c + 1];
            const v2 = field[(r + 1) * stride + c + 1];
            const v3 = field[(r + 1) * stride + c];
            let code = 0;
            if (v0 >= level) code |= 1;
            if (v1 >= level) code |= 2;
            if (v2 >= level) code |= 4;
            if (v3 >= level) code |= 8;
            if (code === 0 || code === 15) continue;
            const pts = [];
            if ((code & 1) !== (code & 2) >> 1) pts.push([c + interp(v0, v1, level), r]);
            if ((code & 2) !== (code & 4) >> 1) pts.push([c + 1, r + interp(v1, v2, level)]);
            if ((code & 4) !== (code & 8) >> 1) pts.push([c + interp(v3, v2, level), r + 1]);
            if ((code & 8) !== (code & 1)) pts.push([c, r + interp(v0, v3, level)]);
            if (pts.length >= 2) {
              pushSeg(pts[0][0] * cell, pts[0][1] * cell, pts[1][0] * cell, pts[1][1] * cell, level);
              if (pts.length === 4) {
                pushSeg(pts[2][0] * cell, pts[2][1] * cell, pts[3][0] * cell, pts[3][1] * cell, level);
              }
            }
          }
        }
      }
      topoPath = path;
      topoLoops = [];
      for (let li = 0; li < levels.length; li++) {
        topoLoops = topoLoops.concat(traceLevelLoops(field, cols, rows, stride, cell, levels[li]));
      }
    }

    const topoDesktop = window.matchMedia('(min-width: 701px)');
    const topoHover = window.matchMedia('(hover: hover) and (pointer: fine)');
    const topoPointer = { x: 0, y: 0, nx: 0.5, ny: 0.5, on: false };

    function topoDesktopLive() {
      return topoDesktop.matches && topoHover.matches;
    }

    const TOPO_BLOOM_RISE = 800;
    const TOPO_BLOOM_STAGGER = 160;
    const TOPO_BLOOM_HOLD = 2000;
    const TOPO_BLOOM_FADE = 900;
    const TOPO_BLOOM_GAP = 1000;
    let topoBloomRaf = 0;
    let topoBloomSeq = null;

    function topoMobileLive() {
      return !topoDesktopLive();
    }

    function traceLevelLoops(field, cols, rows, stride, cell, level) {
      function interp(a, b) {
        const d = b - a;
        return Math.abs(d) < 1e-6 ? 0.5 : (level - a) / d;
      }
      function ptTop(c, r) {
        const t = interp(field[r * stride + c], field[r * stride + c + 1]);
        return { x: (c + t) * cell, y: r * cell };
      }
      function ptRight(c, r) {
        const t = interp(field[r * stride + c + 1], field[(r + 1) * stride + c + 1]);
        return { x: (c + 1) * cell, y: (r + t) * cell };
      }
      function ptBottom(c, r) { return ptTop(c, r + 1); }
      function ptLeft(c, r) { return ptRight(c - 1, r); }
      const T = (c, r) => 'T:' + c + ':' + r;
      const R = (c, r) => 'R:' + c + ':' + r;
      const adj = new Map();
      function link(a, b, p0, p1) {
        if (!adj.has(a)) adj.set(a, []);
        if (!adj.has(b)) adj.set(b, []);
        adj.get(a).push({ to: b, x: p1.x, y: p1.y, x0: p0.x, y0: p0.y });
        adj.get(b).push({ to: a, x: p0.x, y: p0.y, x0: p1.x, y0: p1.y });
      }
      for (let r = 0; r < rows; r++) {
        for (let c = 0; c < cols; c++) {
          const v0 = field[r * stride + c];
          const v1 = field[r * stride + c + 1];
          const v2 = field[(r + 1) * stride + c + 1];
          const v3 = field[(r + 1) * stride + c];
          let code = 0;
          if (v0 >= level) code |= 1;
          if (v1 >= level) code |= 2;
          if (v2 >= level) code |= 4;
          if (v3 >= level) code |= 8;
          if (!code || code === 15) continue;
          const top = T(c, r), right = R(c, r), bottom = T(c, r + 1), left = R(c - 1, r);
          const pT = ptTop(c, r), pR = ptRight(c, r), pB = ptBottom(c, r), pL = ptLeft(c, r);
          const pairs = [];
          switch (code) {
            case 1: case 14: pairs.push([left, top, pL, pT]); break;
            case 2: case 13: pairs.push([top, right, pT, pR]); break;
            case 3: case 12: pairs.push([left, right, pL, pR]); break;
            case 4: case 11: pairs.push([right, bottom, pR, pB]); break;
            case 6: case 9: pairs.push([top, bottom, pT, pB]); break;
            case 7: case 8: pairs.push([left, bottom, pL, pB]); break;
            case 5:
              pairs.push([left, top, pL, pT]);
              pairs.push([right, bottom, pR, pB]);
              break;
            case 10:
              pairs.push([top, right, pT, pR]);
              pairs.push([left, bottom, pL, pB]);
              break;
          }
          for (let i = 0; i < pairs.length; i++) link(pairs[i][0], pairs[i][1], pairs[i][2], pairs[i][3]);
        }
      }
      const used = new Set();
      const ekey = (a, b) => (a < b ? a + '|' + b : b + '|' + a);
      const loops = [];
      adj.forEach((nbrs, start) => {
        for (let n = 0; n < nbrs.length; n++) {
          const first = nbrs[n];
          if (used.has(ekey(start, first.to))) continue;
          const pts = [{ x: first.x0, y: first.y0 }];
          let curr = start;
          let next = first.to;
          let closed = false;
          for (let step = 0; step < 8000; step++) {
            used.add(ekey(curr, next));
            const hop = (adj.get(curr) || []).find((h) => h.to === next);
            if (hop) pts.push({ x: hop.x, y: hop.y });
            if (next === start && step > 1) { closed = true; break; }
            const options = adj.get(next) || [];
            let found = null;
            for (let i = 0; i < options.length; i++) {
              if (options[i].to === curr) continue;
              if (used.has(ekey(next, options[i].to)) && options[i].to !== start) continue;
              found = options[i];
              break;
            }
            if (!found) break;
            curr = next;
            next = found.to;
          }
          if (!closed || pts.length < 4) continue;
          let area = 0, cx = 0, cy = 0;
          for (let i = 0; i < pts.length - 1; i++) {
            area += pts[i].x * pts[i + 1].y - pts[i + 1].x * pts[i].y;
            cx += pts[i].x;
            cy += pts[i].y;
          }
          area = Math.abs(area) * 0.5;
          if (area < 8) continue;
          loops.push({
            pts: pts,
            area: area,
            cx: cx / Math.max(1, pts.length - 1),
            cy: cy / Math.max(1, pts.length - 1)
          });
        }
      });
      return loops;
    }

    function pointInLoop(x, y, loop) {
      const pts = loop.pts;
      let inside = false;
      for (let i = 0, j = pts.length - 1; i < pts.length; j = i++) {
        const xi = pts[i].x, yi = pts[i].y, xj = pts[j].x, yj = pts[j].y;
        if ((yi > y) !== (yj > y) && x < (xj - xi) * (y - yi) / ((yj - yi) || 1e-6) + xi) inside = !inside;
      }
      return inside;
    }

    function loopInside(inner, outer) {
      if (!inner || !outer || inner === outer) return false;
      if (inner.area >= outer.area * 0.98) return false;
      const pts = inner.pts;
      if (pointInLoop(inner.cx, inner.cy, outer)) return true;
      const step = Math.max(1, Math.floor(pts.length / 10));
      let hits = 0;
      let n = 0;
      for (let i = 0; i < pts.length; i += step) {
        n++;
        if (pointInLoop(pts[i].x, pts[i].y, outer)) hits++;
      }
      return n > 0 && hits >= Math.max(1, Math.ceil(n * 0.35));
    }

    let topoNestIndex = 0;

    function buildTopoNests() {
      const viewH = Math.min(topoH, window.innerHeight || topoH);
      const viewA = Math.max(1, (topoW || 1) * viewH);
      const minOuter = viewA * 0.018;
      const maxOuter = viewA * 0.36;
      const usable = topoLoops.filter((loop) => loop.cy < viewH * 1.15 && loop.area > 8);
      const nests = [];
      usable.forEach((outer) => {
        if (outer.area < minOuter || outer.area > maxOuter) return;
        const inner = usable.filter((loop) => loopInside(loop, outer)).sort((a, b) => b.area - a.area);
        if (inner.length < 2) return;
        nests.push([outer].concat(inner));
      });
      nests.sort((a, b) => b.length - a.length || b[0].area - a[0].area);
      topoNests = nests.slice(0, 28);
      topoNestIndex = 0;
    }

    function nestBloomSpan(nest) {
      const n = nest && nest.length ? nest.length : 1;
      const filled = TOPO_BLOOM_RISE + Math.max(0, n - 1) * TOPO_BLOOM_STAGGER;
      return filled + TOPO_BLOOM_HOLD + TOPO_BLOOM_FADE + TOPO_BLOOM_GAP;
    }

    function nestBloomAmount(elapsed, index, nestSize) {
      const riseStart = index * TOPO_BLOOM_STAGGER;
      const allLit = TOPO_BLOOM_RISE + Math.max(0, nestSize - 1) * TOPO_BLOOM_STAGGER;
      const fadeStart = allLit + TOPO_BLOOM_HOLD;
      const fadeEnd = fadeStart + TOPO_BLOOM_FADE;
      if (elapsed < riseStart) return 0;
      if (elapsed < fadeStart) return Math.min(1, (elapsed - riseStart) / TOPO_BLOOM_RISE);
      if (elapsed < fadeEnd) return 1 - (elapsed - fadeStart) / TOPO_BLOOM_FADE;
      return 0;
    }

    function spawnTopoBloom(now) {
      if (!topoNests.length) buildTopoNests();
      if (!topoNests.length) return;
      const nest = topoNests[topoNestIndex % topoNests.length];
      topoNestIndex += 1;
      topoBloomSeq = { nest: nest, t0: now };
    }

    const TOPO_RIDGE_MS = 220;
    let topoRidge = { nest: null, amount: 0, leaving: null, leaveAmt: 0 };
    let topoRidgeRaf = 0;
    let topoRidgeLast = 0;

    function nestAtPoint(x, y) {
      if (!topoLoops.length) return null;
      const viewA = Math.max(1, (topoW || 1) * Math.min(topoH || 1, window.innerHeight || topoH || 1));
      const hit = [];
      for (let i = 0; i < topoLoops.length; i++) {
        if (pointInLoop(x, y, topoLoops[i])) hit.push(topoLoops[i]);
      }
      if (!hit.length) return null;
      hit.sort((a, b) => a.area - b.area);
      const mid = hit.filter((loop) => loop.area > viewA * 0.01 && loop.area < viewA * 0.32);
      const outer = mid.length ? mid[mid.length - 1] : hit[Math.min(1, hit.length - 1)];
      const inner = topoLoops.filter((loop) => loopInside(loop, outer)).sort((a, b) => b.area - a.area);
      return [outer].concat(inner);
    }

    function setRidgeNest(next) {
      const same = topoRidge.nest && next && topoRidge.nest[0] === next[0];
      if (same) return;
      if (topoRidge.nest && topoRidge.amount > 0.02) {
        topoRidge.leaving = topoRidge.nest;
        topoRidge.leaveAmt = topoRidge.amount;
      }
      topoRidge.nest = next;
      topoRidge.amount = next ? 0.02 : 0;
      ensureRidgeFade();
    }

    function tickRidgeFade(now) {
      const dt = Math.min(40, now - (topoRidgeLast || now));
      topoRidgeLast = now;
      const step = dt / TOPO_RIDGE_MS;
      if (topoRidge.nest) topoRidge.amount = Math.min(1, topoRidge.amount + step);
      if (topoRidge.leaving) {
        topoRidge.leaveAmt = Math.max(0, topoRidge.leaveAmt - step);
        if (topoRidge.leaveAmt <= 0) topoRidge.leaving = null;
      }
      paintTopo();
      const busy = (topoRidge.nest && topoRidge.amount < 1) || topoRidge.leaving;
      if (busy) topoRidgeRaf = requestAnimationFrame(tickRidgeFade);
      else topoRidgeRaf = 0;
    }

    function ensureRidgeFade() {
      if (!topoRidgeRaf) {
        topoRidgeLast = performance.now();
        topoRidgeRaf = requestAnimationFrame(tickRidgeFade);
      }
    }

    function strokeLoop(ctx, loop) {
      const pts = loop.pts;
      ctx.beginPath();
      ctx.moveTo(pts[0].x, pts[0].y);
      for (let i = 1; i < pts.length; i++) ctx.lineTo(pts[i].x, pts[i].y);
      ctx.closePath();
      ctx.stroke();
    }

    function paintTopo() {
      if (!topoCtx || !topoPath) return;
      topoCtx.clearRect(0, 0, topoW, topoH);
      topoCtx.lineWidth = 1;
      topoCtx.lineJoin = 'round';
      const live = topoDesktopLive();
      const ox = live ? (topoPointer.nx - 0.5) * 18 : 0;
      const oy = live ? (topoPointer.ny - 0.5) * 12 : 0;
      topoCtx.save();
      topoCtx.translate(ox, oy);
      topoCtx.strokeStyle = topoStroke(topoTheme, false);
      topoCtx.stroke(topoPath);
      if (live) {
        function paintRidgeNest(nest, amount) {
          if (!nest || amount <= 0) return;
          topoCtx.lineWidth = 1.12;
          for (let i = 0; i < nest.length; i++) {
            topoCtx.strokeStyle = topoStroke(topoTheme, amount, 50);
            strokeLoop(topoCtx, nest[i]);
          }
          topoCtx.lineWidth = 1;
        }
        paintRidgeNest(topoRidge.leaving, topoRidge.leaveAmt);
        paintRidgeNest(topoRidge.nest, topoRidge.amount);
      } else if (!live && topoBloomSeq && topoBloomSeq.nest) {
        const now = performance.now();
        const nest = topoBloomSeq.nest;
        const elapsed = now - topoBloomSeq.t0;
        for (let i = 0; i < nest.length; i++) {
          const amount = nestBloomAmount(elapsed, i, nest.length);
          if (amount <= 0) continue;
          topoCtx.strokeStyle = topoStroke(topoTheme, amount, 72);
          topoCtx.lineWidth = 1.15;
          strokeLoop(topoCtx, nest[i]);
        }
        topoCtx.lineWidth = 1;
      }
      topoCtx.restore();
    }

    function resizeTopo() {
      if (!topoCanvas || !topoCtx) return;
      const dpr = Math.min(window.devicePixelRatio || 1, 2);
      topoW = window.innerWidth;
      topoH = Math.max(window.innerHeight, document.documentElement.scrollHeight);
      topoCanvas.width = Math.floor(topoW * dpr);
      topoCanvas.height = Math.floor(topoH * dpr);
      topoCanvas.style.width = topoW + 'px';
      topoCanvas.style.height = topoH + 'px';
      topoCtx.setTransform(dpr, 0, 0, dpr, 0, 0);
      buildTopoPath();
      buildTopoNests();
      paintTopo();
    }

    function tickTopoTheme(now) {
      if (!topoThemeStart) return;
      const raw = Math.min(1, (now - topoThemeStart) / TOPO_THEME_MS);
      const goingLight = topoThemeTo > topoThemeFrom;
      const p = goingLight ? (1 - Math.pow(1 - raw, 3)) : Math.pow(raw, 3);
      topoTheme = topoThemeFrom + (topoThemeTo - topoThemeFrom) * p;
      paintTopo();
      if (raw >= 1) {
        topoThemeStart = 0;
        if (topoAnim) {
          cancelAnimationFrame(topoAnim);
          topoAnim = 0;
        }
        return;
      }
      topoAnim = requestAnimationFrame(tickTopoTheme);
    }

    function startTopoTheme(to) {
      topoThemeFrom = to > topoTheme ? Math.max(topoTheme, 0.7) : topoTheme;
      topoThemeTo = to;
      topoTheme = topoThemeFrom;
      topoThemeStart = performance.now();
      paintTopo();
      if (topoAnim) cancelAnimationFrame(topoAnim);
      topoAnim = requestAnimationFrame(tickTopoTheme);
    }

    resizeTopo();
    window.addEventListener('resize', resizeTopo);
    window.addEventListener('pointermove', (e) => {
      if (!topoDesktopLive()) return;
      topoPointer.on = true;
      topoPointer.x = e.clientX;
      topoPointer.y = e.clientY;
      topoPointer.nx = e.clientX / Math.max(1, window.innerWidth);
      topoPointer.ny = e.clientY / Math.max(1, window.innerHeight);
      const ox = (topoPointer.nx - 0.5) * 18;
      const oy = (topoPointer.ny - 0.5) * 12;
      setRidgeNest(nestAtPoint(e.clientX - ox, e.clientY - oy));
      paintTopo();
    }, { passive: true });
    window.addEventListener('pointerleave', () => {
      topoPointer.on = false;
      setRidgeNest(null);
      paintTopo();
    });
    function tickTopoBloom(now) {
      if (!topoMobileLive() || window.matchMedia('(prefers-reduced-motion: reduce)').matches) {
        topoBloomRaf = 0;
        paintTopo();
        return;
      }
      const seq = topoBloomSeq;
      const span = seq && seq.nest ? nestBloomSpan(seq.nest) : 0;
      if (!seq || now - seq.t0 > span) spawnTopoBloom(now);
      paintTopo();
      topoBloomRaf = requestAnimationFrame(tickTopoBloom);
    }

    function ensureTopoBloom() {
      if (!topoMobileLive() || window.matchMedia('(prefers-reduced-motion: reduce)').matches) {
        if (topoBloomRaf) {
          cancelAnimationFrame(topoBloomRaf);
          topoBloomRaf = 0;
        }
        return;
      }
      if (!topoBloomRaf) topoBloomRaf = requestAnimationFrame(tickTopoBloom);
    }

    function onTopoDesktopChange() {
      if (!topoDesktopLive()) {
        topoPointer.on = false;
        topoPointer.nx = 0.5;
        topoPointer.ny = 0.5;
      }
      paintTopo();
      ensureTopoBloom();
    }
    if (topoDesktop.addEventListener) {
      topoDesktop.addEventListener('change', onTopoDesktopChange);
      topoHover.addEventListener('change', onTopoDesktopChange);
    }
    ensureTopoBloom();

    const DEV_LABEL = {
      planned: 'Planned',
      'in-development': 'In Development',
      released: 'Released'
    };

    const modeToggle = document.getElementById('modeToggle');
    const VIEWS = ['map', 'development', 'availability'];
    const viewTabs = {
      map: document.getElementById('tab-map'),
      development: document.getElementById('tab-development'),
      availability: document.getElementById('tab-availability')
    };
    let lastMapData = null;
    let tagFilter = null;

    function syncSlider() {
      const active = modeToggle.querySelector('.toggle-option.active') || viewTabs.map;
      modeToggle.style.setProperty('--slider-l', active.offsetLeft + 'px');
      modeToggle.style.setProperty('--slider-w', active.offsetWidth + 'px');
    }

    let viewReady = false;

    function stampColumnDelays() {
      const root = document.getElementById('sitemap-links');
      if (!root) return;
      const items = Array.from(root.children);
      const xs = items.map((el) => Math.round(el.getBoundingClientRect().left));
      const unique = Array.from(new Set(xs)).sort((a, b) => a - b);
      items.forEach((el, i) => {
        const col = Math.max(0, unique.indexOf(xs[i]));
        el.style.setProperty('--col', String(col));
      });
    }

    function replayViewFade() {
      const legend = document.querySelector('.legend');
      const links = document.getElementById('sitemap-links');
      [legend, links].forEach((el) => {
        if (!el) return;
        el.classList.remove('view-entering');
        void el.offsetWidth;
        el.classList.add('view-entering');
      });
      requestAnimationFrame(stampColumnDelays);
    }

    function setView(view) {
      const next = VIEWS.includes(view) ? view : 'map';
      const changed = (body.dataset.view || 'map') !== next;
      body.dataset.view = next;
      modeToggle.classList.toggle('map', next === 'map');
      modeToggle.classList.toggle('development', next === 'development');
      modeToggle.classList.toggle('availability', next === 'availability');
      VIEWS.forEach((name) => {
        const tab = viewTabs[name];
        const on = name === next;
        tab.classList.toggle('active', on);
        tab.classList.toggle('inactive', !on);
        tab.setAttribute('aria-selected', on ? 'true' : 'false');
      });
      const hash = '#' + next;
      if (location.hash !== hash) {
        try {
          history.replaceState(null, '', hash);
        } catch (err) {
          // Sandboxed embeds (e.g. srcdoc iframes) can disallow history mutation; ignore.
        }
      }
      if (tagFilter) {
        const ok = next === 'availability'
          ? tagFilter.type === 'availability'
          : next === 'development'
            ? (tagFilter.type === 'dev' || tagFilter.type === 'version' || tagFilter.type === 'category')
            : false;
        if (!ok) tagFilter = null;
      }
      syncLegendActive();
      if (lastMapData) render(lastMapData);
      requestAnimationFrame(syncSlider);
      if (viewReady && changed) replayViewFade();
      viewReady = true;
    }

    document.querySelectorAll('.mode-toggle .toggle-option').forEach((btn) => {
      btn.addEventListener('click', () => setView(btn.dataset.view));
    });

    document.addEventListener('keydown', (e) => {
      if (e.target.closest('input, textarea, [contenteditable="true"]')) return;
      const i = VIEWS.indexOf(body.dataset.view || 'map');
      if (e.key === 'ArrowRight') {
        e.preventDefault();
        setView(VIEWS[Math.min(VIEWS.length - 1, i + 1)]);
      } else if (e.key === 'ArrowLeft') {
        e.preventDefault();
        setView(VIEWS[Math.max(0, i - 1)]);
      }
    });

    function viewFromHash() {
      const name = (location.hash || '#map').slice(1);
      return VIEWS.includes(name) ? name : 'map';
    }

    const LIVE_LABEL = {
      live: 'Live',
      maintenance: 'Maintenance',
      preview: 'Preview',
      down: 'Down',
      unlisted: 'Unlisted'
    };

    function nodeDev(node) {
      return (node.dev && node.dev.status) || 'planned';
    }

    function nodeAvailability(node) {
      return (node.availability && node.availability.status) || 'unlisted';
    }

    function nodeVersion(node) {
      return (node.dev && node.dev.version) || '';
    }

    function nodeCategory(node) {
      return (node.dev && node.dev.category) || '';
    }

    function matchesFilter(node) {
      if (!tagFilter) return true;
      if (tagFilter.type === 'dev') return nodeDev(node) === tagFilter.value;
      if (tagFilter.type === 'version') return nodeVersion(node) === tagFilter.value;
      if (tagFilter.type === 'category') return nodeCategory(node) === tagFilter.value;
      return nodeAvailability(node) === tagFilter.value;
    }

    function filterValue(el) {
      if (el.dataset.filterType === 'dev') return el.dataset.dev;
      if (el.dataset.filterType === 'version') return el.dataset.version;
      if (el.dataset.filterType === 'category') return el.dataset.category;
      return el.dataset.availability;
    }

    function syncLegendActive() {
      document.querySelectorAll('.legend [data-filter-type]').forEach((el) => {
        const on = !!(tagFilter && el.dataset.filterType === tagFilter.type && filterValue(el) === tagFilter.value);
        el.classList.toggle('is-active', on);
        el.setAttribute('aria-pressed', on ? 'true' : 'false');
      });
    }

    function collectField(data, read) {
      const set = new Set();
      (data.domains || []).forEach((domain) => {
        const v = read(domain);
        if (v) set.add(v);
        (domain.pages || []).forEach((page) => {
          const pv = read(page);
          if (pv) set.add(pv);
        });
      });
      return Array.from(set).sort((a, b) => a.localeCompare(b, undefined, { numeric: true }));
    }

    function fillLegendRow(rowId, values, className, type, key) {
      const row = document.getElementById(rowId);
      if (!row) return;
      row.replaceChildren();
      values.forEach((value) => {
        const btn = document.createElement('button');
        btn.type = 'button';
        btn.className = className;
        btn.dataset.filterType = type;
        btn.dataset[key] = value;
        btn.textContent = value;
        row.appendChild(btn);
      });
    }

    function renderDynamicLegend(data) {
      fillLegendRow('legendCategories', collectField(data, nodeCategory), 'system-tag', 'category', 'category');
      fillLegendRow('legendVersions', collectField(data, nodeVersion), 'version-pill', 'version', 'version');
      syncLegendActive();
    }

    window.addEventListener('hashchange', () => setView(viewFromHash()));
    setView(viewFromHash());

    document.querySelector('.legend').addEventListener('click', (e) => {
      const btn = e.target.closest('[data-filter-type]');
      if (!btn) return;
      const type = btn.dataset.filterType;
      const value = filterValue(btn);
      if (tagFilter && tagFilter.type === type && tagFilter.value === value) {
        tagFilter = null;
      } else {
        tagFilter = { type, value };
      }
      syncLegendActive();
      if (lastMapData) render(lastMapData);
    });

    function metaBits(node) {
      const live = (node.availability && node.availability.status) || 'unlisted';
      const dev = (node.dev && node.dev.status) || 'planned';
      const version = (node.dev && node.dev.version) || '';
      const category = (node.dev && node.dev.category) || '';
      return `
        <div class="row-meta">
          <span class="availability-pill" data-availability="${live}"><span class="availability-dot" data-availability="${live}"></span>${LIVE_LABEL[live] || live}</span>
          <span class="dev-pill" data-dev="${dev}">${DEV_LABEL[dev] || dev}</span>
          ${category ? `<span class="system-tag">${category}</span>` : ''}
          ${version ? `<span class="version-pill">${version}</span>` : ''}
        </div>
      `;
    }

    function render(data) {
      lastMapData = data;
      renderDynamicLegend(data);
      const root = document.getElementById('sitemap-links');
      root.replaceChildren();
      (data.domains || []).forEach((domain) => {
        const pages = domain.pages || [];
        const matchingPages = tagFilter ? pages.filter(matchesFilter) : pages;
        const domainMatch = matchesFilter(domain);
        if (tagFilter && !domainMatch && !matchingPages.length) return;

        const col = document.createElement('div');
        col.className = `${domain.subdomain}-links`;

        const domainRow = document.createElement('div');
        domainRow.className = 'domain-row';
        const domainLink = document.createElement('a');
        domainLink.className = 'sub-domain-link';
        domainLink.href = domain.url;
        domainLink.target = '_blank';
        domainLink.rel = 'noopener';
        domainLink.innerHTML = `${domain.icon || ''}${domain.host}`;
        const icon = domainLink.querySelector('svg');
        if (icon) icon.classList.add('domain-icon');
        domainRow.appendChild(domainLink);
        domainRow.insertAdjacentHTML('beforeend', metaBits(domain));
        col.appendChild(domainRow);

        matchingPages.forEach((page) => {
          const row = document.createElement('div');
          row.className = 'page-row';
          row.innerHTML = `
            <a class="sub-page-link" href="${page.url}" target="_blank" rel="noopener">${page.title}</a>
            ${metaBits(page)}
          `;
          col.appendChild(row);
        });

        root.appendChild(col);
      });
      requestAnimationFrame(measureChrome);
      requestAnimationFrame(resizeTopo);
    }

    function compactRangePx() {
      const raw = getComputedStyle(document.documentElement).getPropertyValue('--compact-range').trim();
      const n = parseFloat(raw);
      return Number.isFinite(n) ? n : 160;
    }

    function syncMemojiClip() {
      const img = document.querySelector('.dev-image');
      const toggle = document.getElementById('modeToggle');
      if (!img || !toggle) return;
      const ir = img.getBoundingClientRect();
      const cut = toggle.getBoundingClientRect().bottom;
      const fade = 28;
      if (cut >= ir.bottom - 0.5) {
        img.style.opacity = '1';
        img.style.webkitMaskImage = 'none';
        img.style.maskImage = 'none';
        return;
      }
      if (cut <= ir.top + 0.5) {
        img.style.opacity = '0';
        img.style.webkitMaskImage = 'none';
        img.style.maskImage = 'none';
        return;
      }
      img.style.opacity = '1';
      const solid = Math.max(0, cut - ir.top - fade);
      const end = Math.max(0, cut - ir.top);
      const mask = 'linear-gradient(to bottom, #000 0, #000 ' + solid + 'px, transparent ' + end + 'px, transparent 100%)';
      img.style.webkitMaskImage = mask;
      img.style.maskImage = mask;
    }

    const mapHeader = document.getElementById('mapHeader');
    let lastCompact = -1;

    function measureChrome() {
      if (!mapHeader) return;
      const divider = mapHeader.querySelector('.divider');
      const edge = divider || mapHeader;
      const h = Math.ceil(edge.getBoundingClientRect().bottom);
      document.documentElement.style.setProperty('--chrome-expanded', Math.max(0, h) + 'px');
    }

    const scroller = document.getElementById('scroller');

    function scrollYNow() {
      return scroller ? scroller.scrollTop : window.scrollY;
    }

    function syncHeroCompact() {
      const range = Math.max(1, compactRangePx());
      const y = scrollYNow();
      const t = Math.min(1, Math.max(0, y / range));
      const rounded = t.toFixed(4);
      const cancel = Math.min(y, range);
      document.documentElement.style.setProperty('--scroll-cancel', cancel + 'px');
      if (rounded !== lastCompact) {
        lastCompact = rounded;
        document.documentElement.style.setProperty('--hero-compact', rounded);
        syncMemojiClip();
        measureChrome();
      }
    }

    if (scroller) {
      scroller.addEventListener('scroll', () => {
        requestAnimationFrame(syncHeroCompact);
      }, { passive: true });
    }
    if (mapHeader && scroller) {
      mapHeader.addEventListener('wheel', (e) => {
        scroller.scrollTop += e.deltaY;
      }, { passive: true });
    }
    window.addEventListener('resize', () => {
      measureChrome();
      syncMemojiClip();
      syncSlider();
    });
    measureChrome();
    syncHeroCompact();
    requestAnimationFrame(syncSlider);
    if (window.ResizeObserver && mapHeader) {
      new ResizeObserver(() => measureChrome()).observe(mapHeader);
    }
    const heroImg = document.querySelector('.dev-image');
    if (heroImg && !heroImg.complete) {
      heroImg.addEventListener('load', measureChrome, { once: true });
    }

    function showMapError(err) {
      const root = document.getElementById('sitemap-links');
      root.innerHTML = `<p class="map-error">Could not load sitemap data (${err && err.message ? err.message : err}).</p>`;
    }

    function loadSitemap() {
      fetch('sitemap.json')
        .then((res) => {
          if (!res.ok) throw new Error(res.statusText || String(res.status));
          return res.json();
        })
        .then(render)
        .catch(showMapError);
    }

    loadSitemap();
  </script>
</body>
</html>
