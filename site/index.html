<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <link rel="icon" href="../resources/images/icons/favicon.png" type="image/png" media="(prefers-color-scheme: light)">
  <link rel="icon" href="../resources/images/icons/favicon-white.png" type="image/png" media="(prefers-color-scheme: dark)">
  <link rel="apple-touch-icon" href="../resources/images/icons/apple-touch-icon.png">
  <link rel="apple-touch-icon" href="../resources/images/icons/apple-touch-icon-dark.png" media="(prefers-color-scheme: dark)">
  <link rel="canonical" href="https://site.briancrink.com/map">
  <title>Site Map | Brian Crink</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --hero-compact: 0;
      --compact-range: 160px;
      --image-y: 20px;
      --image-slot: 156px;
      --compact-gap: 18px;
      --tool-collapse: 138px;
      --toggle-h: 48px;
      --scroll-cancel: 0px;
      --chrome-expanded: 420px;
      --page-bg: #000000;
      --page-fg: #ffffff;
    }

    html, body {
      min-height: 100%;
      min-height: 50dvh;
      overflow-x: hidden;
      background-color: var(--page-bg);
      color: var(--page-fg);
    }

    html, body, .header, .container, .page-flow {
      background-color: var(--page-bg);
      transition: background-color 0.45s ease, color 0.45s ease;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      line-height: 1.6;
      opacity: 0;
      animation: fadeIn 1.3s forwards;
      padding: 0;
    }

    body.light {
      --page-bg: #ffffff;
      --page-fg: #1a1a1a;
    }

    @keyframes fadeIn {
      from { opacity: 0; }
      to   { opacity: 1; }
    }

    .container {
      position: relative;
      max-width: 1400px;
      width: 100%;
      margin: 0 auto;
      text-align: center;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 0 16px 48px;
    }

    .header {
      position: fixed;
      top: 0;
      left: 0;
      right: 0;
      z-index: 30;
      width: 100%;
      padding: 10px 16px 12px;
      background-color: var(--page-bg);
    }

    .page-flow {
      width: 100%;
      padding-top: calc(var(--chrome-expanded) - var(--hero-compact) * var(--tool-collapse));
    }

    .divider {
      width: 70%;
      height: 1px;
      border: none;
      background-color: rgba(255, 255, 255, 0.2);
      margin: 1rem auto 0;
    }

    body.light .divider {
      background-color: rgba(0, 0, 0, 0.15);
    }

    @property --pc1 { syntax: '<color>'; inherits: false; initial-value: #ff006e; }
    @property --pc2 { syntax: '<color>'; inherits: false; initial-value: #8338ec; }
    @property --pc3 { syntax: '<color>'; inherits: false; initial-value: #3a86ff; }
    @property --pc4 { syntax: '<color>'; inherits: false; initial-value: #06d6a0; }
    @property --pc5 { syntax: '<color>'; inherits: false; initial-value: #ffbe0b; }

    @keyframes portalChromaFade {
      0%   { --pc1: #ff006e; --pc2: #8338ec; --pc3: #3a86ff; --pc4: #06d6a0; --pc5: #ffbe0b; }
      20%  { --pc1: #ffbe0b; --pc2: #ff006e; --pc3: #8338ec; --pc4: #3a86ff; --pc5: #06d6a0; }
      40%  { --pc1: #06d6a0; --pc2: #ffbe0b; --pc3: #ff006e; --pc4: #8338ec; --pc5: #3a86ff; }
      60%  { --pc1: #3a86ff; --pc2: #06d6a0; --pc3: #ffbe0b; --pc4: #ff006e; --pc5: #8338ec; }
      80%  { --pc1: #8338ec; --pc2: #3a86ff; --pc3: #06d6a0; --pc4: #ffbe0b; --pc5: #ff006e; }
      100% { --pc1: #ff006e; --pc2: #8338ec; --pc3: #3a86ff; --pc4: #06d6a0; --pc5: #ffbe0b; }
    }

    .site-nav-link.portal {
      background-image: linear-gradient(90deg, var(--pc1), var(--pc2), var(--pc3), var(--pc4), var(--pc5));
      -webkit-background-clip: text;
      background-clip: text;
      color: transparent;
      -webkit-text-fill-color: transparent;
      animation: portalChromaFade 8s linear infinite;
    }

    @media (prefers-reduced-motion: reduce) {
      .site-nav-link.portal { animation: none; }
    }

    .site-nav {
      margin: 0;
      color: #ffffff;
      font-size: 1rem;
      font-weight: 600;
      display: flex;
      align-items: center;
      justify-content: center;
      white-space: nowrap;
      letter-spacing: 0.16rem;
    }

    body.light .site-nav { color: #1a1a1a; }

    .site-link {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 0.55rem;
      margin: 0;
    }

    .site-nav .portal {
      text-transform: uppercase;
      font-size: 0.95rem;
      letter-spacing: 0.08rem;
    }

    .site-nav .nav-dot {
      color: #ffffff;
      font-weight: 400;
      font-size: 1.0rem;
      line-height: 1;
      letter-spacing: 0;
    }

    body.light .nav-dot { color: #000000; }

    .site-nav-link {
      color: inherit;
      text-decoration: none;
      cursor: pointer;
      transition: opacity 0.2s ease;
    }

    .site-nav-link:hover { opacity: 0.85; }

    .map-link {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      color: inherit;
      text-decoration: none;
      line-height: 0;
    }

    .map-link:hover { opacity: 0.85; }

    .map-icon {
      width: 2.8rem;
      height: 2.8rem;
      display: block;
    }

    .identity {
      position: relative;
      left: 0;
      right: 0;
      text-align: center;
      z-index: 1;
      margin-top: -2px;
    }

    .identity-inline {
      position: relative;
      display: inline-block;
    }

    .name {
      font-size: 3.0rem;
      font-weight: 600;
      color: #ffffff;
      margin: 0;
      letter-spacing: -0.5px;
      line-height: 1.05;
    }

    body.light .name { color: #1a1a1a; }

    .name-link {
      color: inherit;
      text-decoration: none;
      cursor: pointer;
      transition: opacity 0.2s ease;
    }

    .name-link:hover { opacity: 0.85; }

    .dev-image-mini {
      position: absolute;
      left: 100%;
      top: 50%;
      width: 60px;
      height: 60px;
      margin: 0 0 0 10px;
      object-fit: contain;
      pointer-events: none;
      transform: translateY(-50%);
      opacity: calc(max(0, (var(--hero-compact) - 0.9) / 0.10));
      z-index: 2;
    }

    @media (max-width: 700px) {
      .dev-image-mini {
        display: none !important;
        opacity: 0 !important;
      }
    }

    .hero {
      position: relative;
      width: 100%;
      display: flex;
      flex-direction: column;
      align-items: center;
      margin-top: 0;
    }

    .dev-image {
      position: absolute;
      left: 50%;
      top: var(--image-y);
      width: 160px;
      max-width: 160px;
      height: auto;
      margin: 0 0 0 -80px;
      z-index: 1;
      pointer-events: none;
      opacity: 1;
      clip-path: inset(0 0 max(0px, calc(100% - (var(--image-slot) - var(--hero-compact) * var(--tool-collapse) + var(--toggle-h) - var(--image-y)))) 0);
    }

    .view-toggle-wrap {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 28px;
      margin-top: 0;
      position: relative;
      z-index: 4;
      width: 100%;
      padding-top: calc(var(--image-slot) - (var(--hero-compact) * var(--tool-collapse)));
    }

    .mode-toggle {
      position: relative;
      display: inline-flex;
      width: max-content;
      max-width: calc(100% - 24px);
      background: rgba(255, 255, 255, 0.023);
      border: 1px solid rgba(255, 255, 255, 0.15);
      border-radius: 50px;
      padding: 4px;
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
      box-shadow: 0 4px 20px rgba(0, 0, 0, 0.4);
      margin-bottom: 0;
      z-index: 4;
      transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
    }

    .mode-toggle:hover {
      background: rgba(255, 255, 255, 0.06);
      border-color: rgba(255, 255, 255, 0.25);
      box-shadow: 0 8px 32px rgba(0, 0, 0, 0.5);
    }

    @media (max-width: 700px) {
      body.is-scrolling .mode-toggle {
        backdrop-filter: none;
        -webkit-backdrop-filter: none;
      }
    }

    body.light .mode-toggle {
      background: rgba(0, 0, 0, 0.03);
      border-color: rgba(0, 0, 0, 0.15);
      box-shadow: 0 4px 20px rgba(0, 0, 0, 0.08);
    }

    .toggle-slider {
      position: absolute;
      top: 4px;
      bottom: 4px;
      left: var(--slider-l, 4px);
      width: var(--slider-w, 50%);
      background: rgba(255, 255, 255, 0.18);
      border-radius: 46px;
      transition: left 0.3s cubic-bezier(0.4, 0, 0.2, 1), width 0.3s cubic-bezier(0.4, 0, 0.2, 1), background 0.3s cubic-bezier(0.4, 0, 0.2, 1);
      z-index: 1;
    }

    .mode-toggle.development .toggle-slider {
      background: rgba(125, 211, 252, 0.9);
    }

    .mode-toggle.availability .toggle-slider {
      background: #22c55e;
    }

    body.light .toggle-slider,
    body.light .mode-toggle.map .toggle-slider {
      background: rgba(0, 0, 0, 0.38);
    }

    body.light .mode-toggle.development .toggle-slider {
      background: rgba(125, 211, 252, 0.9);
    }

    body.light .mode-toggle.availability .toggle-slider {
      background: #22c55e;
    }

    .toggle-option {
      position: relative;
      flex: 0 0 auto;
      padding: 8px 16px;
      min-width: 50px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      text-align: center;
      font-size: 15px;
      font-weight: 500;
      border-radius: 46px;
      z-index: 2;
      transition: color 0.2s ease;
      background: transparent;
      border: 0;
      color: rgba(255, 255, 255, 0.55);
      cursor: pointer;
      font-family: inherit;
      white-space: nowrap;
    }

    .toggle-option svg {
      width: 22px;
      height: 22px;
      display: block;
      fill: none;
      stroke: currentColor;
    }

    .toggle-option.active {
      color: rgba(255, 255, 255, 0.72);
    }

    .mode-toggle.development .toggle-option.active,
    .mode-toggle.availability .toggle-option.active {
      color: rgba(255, 255, 255, 0.72);
    }

    .toggle-option.inactive {
      color: rgba(255, 255, 255, 0.55);
    }

    body.light .toggle-option.inactive {
      color: #6b7280;
    }

    body.light .toggle-option.active,
    body.light .mode-toggle.map .toggle-option.active,
    body.light .mode-toggle.development .toggle-option.active,
    body.light .mode-toggle.availability .toggle-option.active {
      color: rgba(255, 255, 255, 0.72);
    }

    .toggle-label {
      position: absolute;
      width: 1px;
      height: 1px;
      padding: 0;
      margin: -1px;
      overflow: hidden;
      clip: rect(0, 0, 0, 0);
      white-space: nowrap;
      border: 0;
    }

    .legend {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 8px;
      width: min(420px, calc(100% - 24px));
      font-size: 0.72rem;
      letter-spacing: 0.02em;
      color: rgba(255, 255, 255, 0.42);
    }

    .legend-row {
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      gap: 8px 10px;
      width: 100%;
    }

    .legend .dev-pill,
    .legend .availability-pill,
    .legend .version-pill,
    .legend .system-tag {
      appearance: none;
      -webkit-appearance: none;
      cursor: pointer;
      transition: opacity 0.2s ease, background 0.2s ease, color 0.2s ease, border-color 0.2s ease;
    }

    .legend .dev-pill:hover,
    .legend .availability-pill:hover,
    .legend .version-pill:hover,
    .legend .system-tag:hover {
      opacity: 0.85;
    }

    .legend .dev-pill.is-active[data-dev="planned"] {
      background: #ddd6fe;
      color: #4c1d95;
    }

    .legend .dev-pill.is-active[data-dev="in-development"] {
      background: #7dd3fc;
      color: #0c4a6e;
    }

    .legend .dev-pill.is-active[data-dev="released"] {
      background: #4ade80;
      color: #14532d;
    }

    .legend .availability-pill.is-active[data-availability="live"] {
      background: #4ade80;
      color: #14532d;
    }

    .legend .availability-pill.is-active[data-availability="maintenance"] {
      background: #fbbf24;
      color: #78350f;
    }

    .legend .availability-pill.is-active[data-availability="down"] {
      background: #f87171;
      color: #7f1d1d;
    }

    .legend .availability-pill.is-active[data-availability="planned"] {
      background: #d1d5db;
      color: #111827;
    }

    .legend .version-pill.is-active {
      background: #93c5fd;
      color: #1e3a8a;
      border-color: #bfdbfe;
    }

    .legend .system-tag.is-active {
      background: #9ca3af;
      color: #111827;
      border-color: #d1d5db;
    }

    body.light .legend { color: rgba(26, 26, 26, 0.45); }

    body[data-view="development"] .legend-status,
    body[data-view="availability"] .legend-dev,
    body[data-view="map"] .legend {
      display: none;
    }

    .links {
      width: 100%;
      column-width: 280px;
      column-gap: 3rem;
      text-align: left;
    }

    .links > div {
      display: flex;
      flex-direction: column;
      align-items: flex-start;
      text-align: left;
      gap: 0.42rem;
      break-inside: avoid;
      -webkit-column-break-inside: avoid;
      margin-bottom: 2.5rem;
      padding-left: 1.31rem;
    }

    @media (max-width: 600px) {
      .links {
        max-width: 320px;
        margin: 0 auto;
        column-width: auto;
      }
    }

    .sub-domain-link {
      display: inline-flex;
      align-items: center;
      gap: 0.5rem;
      margin-left: -1.31rem;
      font-size: 1.2rem;
      font-weight: 500;
      color: #ffffff;
      text-decoration: none;
      cursor: pointer;
      transition: opacity 0.2s ease;
    }

    body.light .sub-domain-link { color: #000000; }

    .domain-icon {
      width: 1.3em;
      height: 1.3em;
      flex-shrink: 0;
    }

    .sub-domain-link:hover { opacity: 0.85; }

    .page-row,
    .domain-row {
      display: flex;
      flex-direction: column;
      align-items: flex-start;
      gap: 0.28rem;
      width: 100%;
    }

    body[data-view="availability"] .page-row,
    body[data-view="availability"] .domain-row {
      flex-direction: row;
      flex-wrap: wrap;
      align-items: center;
      gap: 0.28rem 0.45rem;
    }

    .page-row { margin-left: 0.75rem; }

    .row-meta {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      gap: 0.28rem 0.35rem;
    }

    .sub-page-link {
      font-size: 1.1rem;
      font-weight: 320;
      color: rgb(79, 140, 238);
      text-decoration: none;
      cursor: pointer;
      transition: opacity 0.2s ease;
    }

    body.light .sub-page-link { color: rgba(43, 101, 197, 1); }

    .sub-page-link:hover { opacity: 0.85; }

    .availability-dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      flex-shrink: 0;
      background: #6b7280;
    }

    .availability-dot[data-availability="live"] { background: #22c55e; }
    .availability-dot[data-availability="maintenance"] { background: #f59e0b; }
    .availability-dot[data-availability="unresponsive"],
    .availability-dot[data-availability="down"] { background: #ef4444; }
    .availability-dot[data-availability="planned"] { background: #6b7280; }

    .dev-pill,
    .version-pill,
    .system-tag {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      padding: 2px 8px;
      border-radius: 9999px;
      font-size: 0.64rem;
      font-weight: 600;
      letter-spacing: 0.02em;
      line-height: 1.3;
      white-space: nowrap;
      font-family: ui-monospace, "SF Mono", Menlo, Monaco, "Courier New", monospace;
    }

    .dev-pill[data-dev="planned"] {
      background: rgba(196, 181, 253, 0.18);
      color: #ddd6fe;
      border: 1px solid rgba(196, 181, 253, 0.32);
    }

    .dev-pill[data-dev="in-development"] {
      background: rgba(125, 211, 252, 0.16);
      color: #7dd3fc;
      border: 1px solid rgba(125, 211, 252, 0.32);
    }

    .dev-pill[data-dev="released"] {
      background: rgba(34, 197, 94, 0.16);
      color: #4ade80;
      border: 1px solid rgba(34, 197, 94, 0.28);
    }

    .availability-pill {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      padding: 2px 8px 2px 7px;
      border-radius: 9999px;
      font-size: 0.64rem;
      font-weight: 600;
      letter-spacing: 0.02em;
      line-height: 1.3;
      white-space: nowrap;
      font-family: ui-monospace, "SF Mono", Menlo, Monaco, "Courier New", monospace;
    }

    .availability-pill[data-availability="live"] {
      background: rgba(39, 201, 63, 0.16);
      color: #4ade80;
      border: 1px solid rgba(39, 201, 63, 0.32);
    }

    .availability-pill[data-availability="maintenance"] {
      background: rgba(245, 158, 11, 0.16);
      color: #fbbf24;
      border: 1px solid rgba(245, 158, 11, 0.28);
    }

    .availability-pill[data-availability="unresponsive"],
    .availability-pill[data-availability="down"] {
      background: rgba(239, 68, 68, 0.16);
      color: #f87171;
      border: 1px solid rgba(239, 68, 68, 0.28);
    }

    .availability-pill[data-availability="planned"] {
      background: rgba(107, 114, 128, 0.18);
      color: #d1d5db;
      border: 1px solid rgba(107, 114, 128, 0.28);
    }

    .version-pill {
      background: #1e40af;
      color: #ffffff;
      border: 1px solid #93c5fd;
    }

    .system-tag {
      background: #1f2937;
      color: #9ca3af;
      border: 1px solid rgba(156, 163, 175, 0.45);
    }

    body.light .dev-pill[data-dev="planned"] {
      background: rgba(167, 139, 250, 0.16);
      color: #7c3aed;
      border-color: rgba(167, 139, 250, 0.28);
    }

    body.light .dev-pill[data-dev="in-development"] {
      background: rgba(14, 165, 233, 0.12);
      color: #0284c7;
      border-color: rgba(14, 165, 233, 0.24);
    }

    body.light .system-tag {
      background: #f3f4f6;
      color: #4b5563;
      border-color: rgba(0, 0, 0, 0.08);
    }

    body.light .availability-pill[data-availability="planned"] {
      color: #4b5563;
    }

    body[data-view="development"] .links .availability-pill { display: none; }
    body[data-view="availability"] .links .dev-pill,
    body[data-view="availability"] .links .version-pill,
    body[data-view="availability"] .links .system-tag { display: none; }
    body[data-view="map"] .row-meta { display: none; }

    .theme-toggle {
      position: fixed;
      top: 12px;
      right: 12px;
      z-index: 40;
      background: transparent;
      border: none;
      width: 48px;
      height: 48px;
      cursor: pointer;
      padding: 8px;
      border-radius: 50%;
      transition: transform 0.3s;
      color: #ffffff;
    }

    .theme-toggle:hover { transform: rotate(20deg); }
    body.light .theme-toggle { color: #1a1a1a; }
    .theme-toggle svg { width: 28px; height: 28px; display: block; }

    .map-error {
      color: rgba(255, 255, 255, 0.45);
      font-size: 0.92rem;
    }
  </style>
</head>
<body data-view="map">
  <div class="container">
    <div class="header" id="mapHeader">
      <div class="site-nav">
        <p class="site-link">
          <a href="https://portal.briancrink.com" class="site-nav-link portal">Portal</a>
          <span class="nav-dot" aria-hidden="true">•</span>
          <a href="https://site.briancrink.com/map" class="map-link" aria-label="Site map"><svg class="map-icon" viewBox="0 0 24 24" fill="none" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
              <clipPath id="mapFillPortal"><path d="M3.15 7.85 L8.85 4.55 L15.05 8.05 L20.7 4.75 L20.7 16.25 L15.05 19.55 L8.85 16.05 L3.15 19.35 Z"/></clipPath>
              <g clip-path="url(#mapFillPortal)">
                <path d="M3.15 7.85 L8.85 4.55 L15.05 8.05 L20.7 4.75 L20.7 16.25 L15.05 19.55 L8.85 16.05 L3.15 19.35 Z" fill="#3f8f4e"/>
                <path d="M3.15 19.35 C 8.85 11.05, 15.05 13.8, 20.7 8.75 V 14.65 C 18.9 15.9, 16.15 18.4, 14.85 19.35 L 3.15 19.35 Z" fill="#3a86ff"/>
              </g>
              <path d="M3.15 7.85 L8.85 4.55 L15.05 8.05 L20.7 4.75 L20.7 16.25 L15.05 19.55 L8.85 16.05 L3.15 19.35 Z" fill="none" stroke="rgba(47, 58, 51, 0.32)" stroke-width="0.85"/>
              <line x1="8.85" y1="6.2" x2="8.85" y2="14.4" stroke="rgba(255,255,255,0.62)" stroke-width="0.36" stroke-linecap="round"/>
              <line x1="15.05" y1="9.7" x2="15.05" y2="17.9" stroke="rgba(255,255,255,0.62)" stroke-width="0.36" stroke-linecap="round"/>
              <g class="map-compass">
                <circle cx="6.114" cy="14.75" r="2.38" fill="#ffffff" stroke="#2eb5e8" stroke-width="0.58"/>
                <circle cx="6.114" cy="14.75" r="2.07" fill="none" stroke="#1b94d0" stroke-width="0.16"/>
                <line x1="6.114" y1="13.02" x2="6.114" y2="12.68" stroke="#9ecce4" stroke-width="0.22" stroke-linecap="round"/>
                <line x1="6.114" y1="16.48" x2="6.114" y2="16.82" stroke="#9ecce4" stroke-width="0.22" stroke-linecap="round"/>
                <line x1="4.384" y1="14.75" x2="4.044" y2="14.75" stroke="#9ecce4" stroke-width="0.22" stroke-linecap="round"/>
                <line x1="7.844" y1="14.75" x2="8.184" y2="14.75" stroke="#9ecce4" stroke-width="0.22" stroke-linecap="round"/>
                <path d="M7.259 13.605 L5.605 14.241 L6.623 15.259 Z" fill="#ef4a3c"/>
                <path d="M4.969 15.895 L5.605 14.241 L6.623 15.259 Z" fill="#33b7e8"/>
                <circle cx="6.114" cy="14.75" r="0.46" fill="#ffffff"/>
              </g>
              <line x1="19.545" y1="13.689" x2="22.395" y2="16.539" stroke="#e0b36a" stroke-width="1.85" stroke-linecap="round"/>
              <circle cx="16.858" cy="11.002" r="2.85" fill="rgba(90, 190, 255, 0.38)" stroke="#8b9098" stroke-width="0.82"/>
            </svg></a>
        </p>
      </div>
      <div class="identity">
        <div class="identity-inline">
          <h1 class="name"><a href="https://briancrink.com" class="name-link">Brian Crink</a></h1>
          <img src="../resources/images/profile/developer_emoji.png" alt="" class="dev-image-mini" draggable="false" data-fallback-src="https://raw.githubusercontent.com/briancrink/resources.briancrink.com/main/images/profile/developer_emoji.png" onerror="if(!this.dataset.fell && this.dataset.fallbackSrc){this.dataset.fell='1';this.src=this.dataset.fallbackSrc;}">
        </div>
      </div>
      <div class="hero">
        <img src="../resources/images/profile/developer_emoji.png" alt="Software Developer" class="dev-image" draggable="false" data-fallback-src="https://raw.githubusercontent.com/briancrink/resources.briancrink.com/main/images/profile/developer_emoji.png" onerror="if(!this.dataset.fell && this.dataset.fallbackSrc){this.dataset.fell='1';this.src=this.dataset.fallbackSrc;}">
        <div class="view-toggle-wrap">
          <div class="mode-toggle map" id="modeToggle" role="tablist" aria-label="Map view">
            <div class="toggle-slider" id="toggleSlider"></div>
            <button type="button" class="toggle-option active" id="tab-map" role="tab" data-view="map" aria-selected="true" aria-label="Map">
              <svg viewBox="0 0 24 24" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                <path d="M3.15 7.85 L8.85 4.55 L15.05 8.05 L20.7 4.75 L20.7 16.25 L15.05 19.55 L8.85 16.05 L3.15 19.35 Z"/>
                <line x1="8.85" y1="6.2" x2="8.85" y2="16.05"/>
                <line x1="15.05" y1="8.05" x2="15.05" y2="19.55"/>
              </svg>
              <span class="toggle-label">Map</span>
            </button>
            <button type="button" class="toggle-option inactive" id="tab-development" role="tab" data-view="development" aria-selected="false" aria-label="Development">
              <svg viewBox="0 0 24 24" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                <polyline points="6.4 5.6 1.1 12 6.4 18.4"/>
                <line x1="13.7" y1="6.2" x2="10.3" y2="17.8"/>
                <polyline points="17.6 5.6 22.9 12 17.6 18.4"/>
              </svg>
              <span class="toggle-label">Development</span>
            </button>
            <button type="button" class="toggle-option inactive" id="tab-availability" role="tab" data-view="availability" aria-selected="false" aria-label="Availability">
              <svg viewBox="0 0 24 24" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                <circle cx="12" cy="12" r="2.15" fill="currentColor" stroke="none"/>
                <path d="M7.35 8.15a6.15 6.15 0 0 0 0 7.7"/>
                <path d="M16.65 8.15a6.15 6.15 0 0 1 0 7.7"/>
                <path d="M5.15 6a9.1 9.1 0 0 0 0 12"/>
                <path d="M18.85 6a9.1 9.1 0 0 1 0 12"/>
              </svg>
              <span class="toggle-label">Availability</span>
            </button>
          </div>
          <div class="legend" role="group" aria-label="Filter by tag">
            <div class="legend-row">
              <button type="button" class="legend-dev dev-pill" data-filter-type="dev" data-dev="planned">Planned</button>
              <button type="button" class="legend-dev dev-pill" data-filter-type="dev" data-dev="in-development">In Development</button>
              <button type="button" class="legend-dev dev-pill" data-filter-type="dev" data-dev="released">Released</button>
              <button type="button" class="legend-status availability-pill" data-filter-type="availability" data-availability="live"><span class="availability-dot" data-availability="live"></span>Live</button>
              <button type="button" class="legend-status availability-pill" data-filter-type="availability" data-availability="maintenance"><span class="availability-dot" data-availability="maintenance"></span>Maintenance</button>
              <button type="button" class="legend-status availability-pill" data-filter-type="availability" data-availability="down"><span class="availability-dot" data-availability="down"></span>Down</button>
              <button type="button" class="legend-status availability-pill" data-filter-type="availability" data-availability="planned"><span class="availability-dot" data-availability="planned"></span>Unlisted</button>
            </div>
            <div class="legend-row legend-categories legend-dev" id="legendCategories"></div>
            <div class="legend-row legend-versions legend-dev" id="legendVersions"></div>
          </div>
        </div>
      </div>
      <hr class="divider">
    </div>

    <div class="page-flow" id="pageFlow">
      <div class="links" id="sitemap-links"></div>
    </div>

    <button class="theme-toggle" id="theme-toggle" type="button" tabindex="-1">
      <svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.25" stroke-linecap="round" aria-hidden="true"><circle cx="12" cy="12" r="4.15"/><line x1="12" y1="2.4" x2="12" y2="5.1"/><line x1="12" y1="18.9" x2="12" y2="21.6"/><line x1="2.4" y1="12" x2="5.1" y2="12"/><line x1="18.9" y1="12" x2="21.6" y2="12"/><line x1="5.2" y1="5.2" x2="7.1" y2="7.1"/><line x1="16.9" y1="16.9" x2="18.8" y2="18.8"/><line x1="18.8" y1="5.2" x2="16.9" y2="7.1"/><line x1="7.1" y1="16.9" x2="5.2" y2="18.8"/></svg>
    </button>
  </div>

  <script>
    const toggleBtn = document.getElementById('theme-toggle');
    const body = document.body;
    const sunIcon = `<svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.25" stroke-linecap="round" aria-hidden="true"><circle cx="12" cy="12" r="4.15"/><line x1="12" y1="2.4" x2="12" y2="5.1"/><line x1="12" y1="18.9" x2="12" y2="21.6"/><line x1="2.4" y1="12" x2="5.1" y2="12"/><line x1="18.9" y1="12" x2="21.6" y2="12"/><line x1="5.2" y1="5.2" x2="7.1" y2="7.1"/><line x1="16.9" y1="16.9" x2="18.8" y2="18.8"/><line x1="18.8" y1="5.2" x2="16.9" y2="7.1"/><line x1="7.1" y1="16.9" x2="5.2" y2="18.8"/></svg>`;
    const moonIcon = `<svg width="28" height="28" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M21 14.35A9 9 0 1 1 9.65 3 7.15 7.15 0 0 0 21 14.35z"/></svg>`;

    function setToggleIcon() {
      toggleBtn.innerHTML = body.classList.contains('light') ? moonIcon : sunIcon;
    }

    toggleBtn.addEventListener('click', () => {
      body.classList.toggle('light');
      setToggleIcon();
    });
    toggleBtn.addEventListener('mouseenter', setToggleIcon);
    toggleBtn.addEventListener('mouseleave', setToggleIcon);

    const DEV_LABEL = {
      planned: 'Planned',
      'in-development': 'In Development',
      released: 'Released'
    };

    const modeToggle = document.getElementById('modeToggle');
    const VIEWS = ['map', 'development', 'availability'];
    const viewTabs = {
      map: document.getElementById('tab-map'),
      development: document.getElementById('tab-development'),
      availability: document.getElementById('tab-availability')
    };
    let lastMapData = null;
    let tagFilter = null;

    function syncSlider() {
      const active = modeToggle.querySelector('.toggle-option.active') || viewTabs.map;
      modeToggle.style.setProperty('--slider-l', active.offsetLeft + 'px');
      modeToggle.style.setProperty('--slider-w', active.offsetWidth + 'px');
    }

    function setView(view) {
      const next = VIEWS.includes(view) ? view : 'map';
      body.dataset.view = next;
      modeToggle.classList.toggle('map', next === 'map');
      modeToggle.classList.toggle('development', next === 'development');
      modeToggle.classList.toggle('availability', next === 'availability');
      VIEWS.forEach((name) => {
        const tab = viewTabs[name];
        const on = name === next;
        tab.classList.toggle('active', on);
        tab.classList.toggle('inactive', !on);
        tab.setAttribute('aria-selected', on ? 'true' : 'false');
      });
      const hash = '#' + next;
      if (location.hash !== hash) history.replaceState(null, '', hash);
      if (tagFilter) {
        const ok = next === 'availability'
          ? tagFilter.type === 'availability'
          : next === 'development'
            ? (tagFilter.type === 'dev' || tagFilter.type === 'version' || tagFilter.type === 'category')
            : false;
        if (!ok) tagFilter = null;
      }
      syncLegendActive();
      if (lastMapData) render(lastMapData);
      requestAnimationFrame(syncSlider);
    }

    document.querySelectorAll('.mode-toggle .toggle-option').forEach((btn) => {
      btn.addEventListener('click', () => setView(btn.dataset.view));
    });

    document.addEventListener('keydown', (e) => {
      if (e.target.closest('input, textarea, [contenteditable="true"]')) return;
      const i = VIEWS.indexOf(body.dataset.view || 'map');
      if (e.key === 'ArrowRight') {
        e.preventDefault();
        setView(VIEWS[Math.min(VIEWS.length - 1, i + 1)]);
      } else if (e.key === 'ArrowLeft') {
        e.preventDefault();
        setView(VIEWS[Math.max(0, i - 1)]);
      }
    });

    function viewFromHash() {
      const name = (location.hash || '#map').slice(1);
      return VIEWS.includes(name) ? name : 'map';
    }

    const LIVE_LABEL = {
      live: 'Live',
      maintenance: 'Maintenance',
      unresponsive: 'Unresponsive',
      down: 'Down',
      planned: 'Unlisted'
    };

    function nodeDev(node) {
      return (node.dev && node.dev.status) || 'planned';
    }

    function nodeAvailability(node) {
      return (node.availability && node.availability.status) || 'planned';
    }

    function nodeVersion(node) {
      return (node.dev && node.dev.version) || '';
    }

    function nodeCategory(node) {
      return (node.dev && node.dev.category) || '';
    }

    function matchesFilter(node) {
      if (!tagFilter) return true;
      if (tagFilter.type === 'dev') return nodeDev(node) === tagFilter.value;
      if (tagFilter.type === 'version') return nodeVersion(node) === tagFilter.value;
      if (tagFilter.type === 'category') return nodeCategory(node) === tagFilter.value;
      return nodeAvailability(node) === tagFilter.value;
    }

    function filterValue(el) {
      if (el.dataset.filterType === 'dev') return el.dataset.dev;
      if (el.dataset.filterType === 'version') return el.dataset.version;
      if (el.dataset.filterType === 'category') return el.dataset.category;
      return el.dataset.availability;
    }

    function syncLegendActive() {
      document.querySelectorAll('.legend [data-filter-type]').forEach((el) => {
        const on = !!(tagFilter && el.dataset.filterType === tagFilter.type && filterValue(el) === tagFilter.value);
        el.classList.toggle('is-active', on);
        el.setAttribute('aria-pressed', on ? 'true' : 'false');
      });
    }

    function collectField(data, read) {
      const set = new Set();
      (data.domains || []).forEach((domain) => {
        const v = read(domain);
        if (v) set.add(v);
        (domain.pages || []).forEach((page) => {
          const pv = read(page);
          if (pv) set.add(pv);
        });
      });
      return Array.from(set).sort((a, b) => a.localeCompare(b, undefined, { numeric: true }));
    }

    function fillLegendRow(rowId, values, className, type, key) {
      const row = document.getElementById(rowId);
      if (!row) return;
      row.replaceChildren();
      values.forEach((value) => {
        const btn = document.createElement('button');
        btn.type = 'button';
        btn.className = className;
        btn.dataset.filterType = type;
        btn.dataset[key] = value;
        btn.textContent = value;
        row.appendChild(btn);
      });
    }

    function renderDynamicLegend(data) {
      fillLegendRow('legendCategories', collectField(data, nodeCategory), 'system-tag', 'category', 'category');
      fillLegendRow('legendVersions', collectField(data, nodeVersion), 'version-pill', 'version', 'version');
      syncLegendActive();
    }

    window.addEventListener('hashchange', () => setView(viewFromHash()));
    setView(viewFromHash());

    document.querySelector('.legend').addEventListener('click', (e) => {
      const btn = e.target.closest('[data-filter-type]');
      if (!btn) return;
      const type = btn.dataset.filterType;
      const value = filterValue(btn);
      if (tagFilter && tagFilter.type === type && tagFilter.value === value) {
        tagFilter = null;
      } else {
        tagFilter = { type, value };
      }
      syncLegendActive();
      if (lastMapData) render(lastMapData);
    });

    function metaBits(node) {
      const live = (node.availability && node.availability.status) || 'planned';
      const dev = (node.dev && node.dev.status) || 'planned';
      const version = (node.dev && node.dev.version) || '';
      const category = (node.dev && node.dev.category) || '';
      return `
        <div class="row-meta">
          <span class="availability-pill" data-availability="${live}"><span class="availability-dot" data-availability="${live}"></span>${LIVE_LABEL[live] || live}</span>
          <span class="dev-pill" data-dev="${dev}">${DEV_LABEL[dev] || dev}</span>
          ${category ? `<span class="system-tag">${category}</span>` : ''}
          ${version ? `<span class="version-pill">${version}</span>` : ''}
        </div>
      `;
    }

    function render(data) {
      lastMapData = data;
      renderDynamicLegend(data);
      const root = document.getElementById('sitemap-links');
      root.replaceChildren();
      (data.domains || []).forEach((domain) => {
        const pages = domain.pages || [];
        const matchingPages = tagFilter ? pages.filter(matchesFilter) : pages;
        const domainMatch = matchesFilter(domain);
        if (tagFilter && !domainMatch && !matchingPages.length) return;

        const col = document.createElement('div');
        col.className = `${domain.subdomain}-links`;

        const domainRow = document.createElement('div');
        domainRow.className = 'domain-row';
        const domainLink = document.createElement('a');
        domainLink.className = 'sub-domain-link';
        domainLink.href = domain.url;
        domainLink.target = '_blank';
        domainLink.rel = 'noopener';
        domainLink.innerHTML = `${domain.icon || ''}${domain.host}`;
        const icon = domainLink.querySelector('svg');
        if (icon) icon.classList.add('domain-icon');
        domainRow.appendChild(domainLink);
        domainRow.insertAdjacentHTML('beforeend', metaBits(domain));
        col.appendChild(domainRow);

        matchingPages.forEach((page) => {
          const row = document.createElement('div');
          row.className = 'page-row';
          row.innerHTML = `
            <a class="sub-page-link" href="${page.url}" target="_blank" rel="noopener">${page.title}</a>
            ${metaBits(page)}
          `;
          col.appendChild(row);
        });

        root.appendChild(col);
      });
      requestAnimationFrame(measureChrome);
    }

    function compactRangePx() {
      const raw = getComputedStyle(document.documentElement).getPropertyValue('--compact-range').trim();
      const n = parseFloat(raw);
      return Number.isFinite(n) ? n : 160;
    }

    const mapHeader = document.getElementById('mapHeader');
    let lastCompact = -1;
    let scrollRaf = 0;
    let scrollIdle = 0;

    function measureChrome() {
      if (!mapHeader) return;
      const compact = parseFloat(getComputedStyle(document.documentElement).getPropertyValue('--hero-compact')) || 0;
      const collapse = parseFloat(getComputedStyle(document.documentElement).getPropertyValue('--tool-collapse')) || 138;
      const expanded = mapHeader.getBoundingClientRect().height + compact * collapse + 24;
      document.documentElement.style.setProperty('--chrome-expanded', Math.max(320, Math.ceil(expanded)) + 'px');
    }

    function syncHeroCompact() {
      const range = Math.max(1, compactRangePx());
      const y = window.scrollY || 0;
      const t = Math.min(1, Math.max(0, y / range));
      const rounded = t.toFixed(2);
      if (rounded !== lastCompact) {
        lastCompact = rounded;
        document.documentElement.style.setProperty('--hero-compact', rounded);
      }
    }

    window.addEventListener('scroll', () => {
      if (window.innerWidth <= 700) {
        body.classList.add('is-scrolling');
        clearTimeout(scrollIdle);
        scrollIdle = setTimeout(() => body.classList.remove('is-scrolling'), 140);
      }
      if (scrollRaf) return;
      scrollRaf = requestAnimationFrame(() => {
        scrollRaf = 0;
        syncHeroCompact();
      });
    }, { passive: true });
    window.addEventListener('resize', () => {
      measureChrome();
      syncSlider();
    });
    measureChrome();
    syncHeroCompact();
    requestAnimationFrame(syncSlider);
    const heroImg = document.querySelector('.dev-image');
    if (heroImg && !heroImg.complete) {
      heroImg.addEventListener('load', measureChrome, { once: true });
    }

    function showMapError(err) {
      const root = document.getElementById('sitemap-links');
      root.innerHTML = `<p class="map-error">Could not load sitemap data (${err && err.message ? err.message : err}).</p>`;
    }

    function loadSitemap() {
      fetch('sitemap.json')
        .then((res) => {
          if (!res.ok) throw new Error(res.statusText || String(res.status));
          return res.json();
        })
        .then(render)
        .catch(showMapError);
    }

    loadSitemap();
  </script>
</body>
</html>
